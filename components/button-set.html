<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button set</title>
    <style>

body {
    background-color: whitesmoke;
    font-family: Arial, sans-serif;
}

h2 {
    color: #222222;
    font-size: 20px;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.button-group .btn {
    margin-right: 10px;
    margin-bottom: 10px;
}

.btn-primary {
    background-color: navy;
    color: white;
}

.btn-secondary {
    background-color: #DCE6F1;
    color: #222222;
}

.btn-outline {
    background-color: rgb(255, 255, 255);
    color: black;
}

.btn-send {
    background-color: rgba(230, 126, 34, 1);
    color: white;
}

.btn{
    border: 2px solid white;
}


.btn-secondary,
.btn-outline {
    color: #222222;
}

.btn-primary:hover {
    background-color: blue;
}

.btn-secondary:hover {
    background-color: lightblue;
}

.btn-outline:hover {
    background-color: gray;
    color: white;
}

.btn-send:hover {
    background-color: orangered;
}

footer a {
    color: purple;
    font-size: 13px;
}

    </style>
</head>
<body>
<main> 
    <H2>Kumpulan tombol</H2>
    
    <div class="button-group">
        <a href="#" class="btn btn-primary">Lihat Proyek</a>
    
        <a href="#" class="btn btn-secondary">Unduh CV</a>
    
        <a href="#" class="btn btn-outline">Hubungi Saya</a>
    
        <a href="#" class="btn btn-send">Kirim Pesan</a>

    </div>
</main>

<footer>
    <a href="#">Kembali ke beranda</a>
</footer>


</body>
</html>
